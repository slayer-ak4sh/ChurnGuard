spring.application.name=orchestrator

# PostgreSQL (Updated for ChurnGuard container)
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/churnguard_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:010200}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Service URLs
ml.service.url=${ML_SERVICE_URL:http://localhost:8001}
agent.service.url=${AGENT_SERVICE_URL:http://localhost:8002}

server.port=8000