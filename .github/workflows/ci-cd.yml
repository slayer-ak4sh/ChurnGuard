name: RetainIQ CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Test Python services ──────────────────────────────────────────────────
  test-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RetainIQ
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn pandas numpy scikit-learn xgboost lightgbm \
                      joblib httpx python-dotenv pydantic \
                      langchain langchain-groq langchain-core langchain-community \
                      pytest pytest-asyncio

      - name: Train model
        run: python train_model.py

      - name: Test ML service
        run: |
          python -c "
          from ml_service.main import app
          from fastapi.testclient import TestClient
          client = TestClient(app)
          r = client.get('/health')
          assert r.status_code == 200
          r = client.post('/predict', json={
              'tenure': 12, 'MonthlyCharges': 65.0,
              'Contract': 'Month-to-month', 'InternetService': 'DSL'
          })
          assert r.status_code == 200
          assert 'churn_probability' in r.json()
          print('✅ ML service tests passed')
          "

      - name: Test agent service
        run: |
          python -c "
          from agent_service.main import app
          from fastapi.testclient import TestClient
          client = TestClient(app)
          r = client.get('/health')
          assert r.status_code == 200
          r = client.post('/recommend', json={
              'tenure': 5, 'MonthlyCharges': 85.0, 'Contract': 'Month-to-month',
              'InternetService': 'Fiber optic', 'OnlineSecurity': False,
              'TechSupport': False, 'PaymentMethod': 'Electronic check',
              'Partner': False, 'Dependents': False,
              'churn_probability': 0.78, 'risk_level': 'HIGH'
          })
          assert r.status_code == 200
          assert 'recommendations' in r.json()
          print('✅ Agent service tests passed')
          "

  # ── Test Spring Boot orchestrator ─────────────────────────────────────────
  test-java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RetainIQ/orchestrator
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build orchestrator
        run: mvn package -DskipTests -q

      - name: Verify JAR exists
        run: ls -lh target/orchestrator-1.0.0.jar && echo "✅ Spring Boot JAR built"

  # ── Test React frontend ────────────────────────────────────────────────────
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RetainIQ/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: RetainIQ/frontend/package-lock.json

      - name: Install & build
        run: |
          npm ci
          npm run build

  # ── Build & push Docker images ─────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [test-python, test-java, test-frontend]
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: RetainIQ
    steps:
      - uses: actions/checkout@v4

      - name: Train model for Docker build
        run: |
          pip install pandas numpy scikit-learn xgboost lightgbm joblib
          python train_model.py

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ML service
        uses: docker/build-push-action@v5
        with:
          context: ./RetainIQ
          file: ./RetainIQ/Dockerfile.ml
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/retainiq-ml:latest

      - name: Build and push Agent service
        uses: docker/build-push-action@v5
        with:
          context: ./RetainIQ
          file: ./RetainIQ/Dockerfile.agent
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/retainiq-agent:latest

      - name: Build and push Orchestrator
        uses: docker/build-push-action@v5
        with:
          context: ./RetainIQ
          file: ./RetainIQ/Dockerfile.orchestrator
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/retainiq-orchestrator:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./RetainIQ
          file: ./RetainIQ/Dockerfile.frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/retainiq-frontend:latest
