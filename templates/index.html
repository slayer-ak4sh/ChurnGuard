<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Telecom Churn AI | Retention Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --card2: #21253a;
      --border: #2e3250;
      --accent: #6c63ff;
      --accent2: #00d4aa;
      --danger: #ff4d6d;
      --warn: #ffb347;
      --success: #00d4aa;
      --text: #e8eaf6;
      --muted: #8b8fa8;
    }

    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a1d27 0%, #12152a 100%);
      border-bottom: 1px solid var(--border);
      padding: 18px 40px;
      display: flex; align-items: center; gap: 14px;
    }
    header .logo { font-size: 22px; font-weight: 700; color: var(--accent); }
    header .subtitle { font-size: 13px; color: var(--muted); }
    header .badge {
      margin-left: auto; background: rgba(108,99,255,0.15);
      border: 1px solid var(--accent); color: var(--accent);
      padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
    }

    /* ── Layout ── */
    .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media(max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

    /* ── Cards ── */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px;
    }
    .card-title {
      font-size: 14px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 20px;
    }

    /* ── Form ── */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; color: var(--muted); font-weight: 500; }
    .form-group input, .form-group select {
      background: var(--card2); border: 1px solid var(--border);
      color: var(--text); padding: 10px 14px; border-radius: 10px;
      font-size: 14px; font-family: inherit; outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
    .form-group select option { background: var(--card2); }

    .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
    .checkbox-item {
      display: flex; align-items: center; gap: 8px;
      background: var(--card2); border: 1px solid var(--border);
      padding: 10px 14px; border-radius: 10px; cursor: pointer;
      transition: border-color 0.2s;
    }
    .checkbox-item:hover { border-color: var(--accent); }
    .checkbox-item input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
    .checkbox-item label { font-size: 13px; cursor: pointer; }

    .btn-predict {
      width: 100%; margin-top: 20px; padding: 14px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border: none; border-radius: 12px; color: white;
      font-size: 15px; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-predict:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-predict:active { transform: translateY(0); }
    .btn-predict:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Results ── */
    #results { display: none; }

    /* Risk Meter */
    .risk-meter-wrap { text-align: center; padding: 10px 0 20px; }
    .risk-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .risk-value { font-size: 52px; font-weight: 700; line-height: 1; }
    .risk-value.HIGH { color: var(--danger); }
    .risk-value.MEDIUM { color: var(--warn); }
    .risk-value.LOW { color: var(--success); }
    .risk-badge {
      display: inline-block; margin-top: 8px;
      padding: 4px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
    }
    .risk-badge.HIGH { background: rgba(255,77,109,0.15); color: var(--danger); border: 1px solid var(--danger); }
    .risk-badge.MEDIUM { background: rgba(255,179,71,0.15); color: var(--warn); border: 1px solid var(--warn); }
    .risk-badge.LOW { background: rgba(0,212,170,0.15); color: var(--success); border: 1px solid var(--success); }

    /* Progress bar */
    .progress-bar-wrap { margin-top: 16px; }
    .progress-bar-bg { background: var(--card2); border-radius: 8px; height: 10px; overflow: hidden; }
    .progress-bar-fill { height: 100%; border-radius: 8px; transition: width 1s ease; }
    .progress-bar-fill.HIGH { background: linear-gradient(90deg, var(--warn), var(--danger)); }
    .progress-bar-fill.MEDIUM { background: linear-gradient(90deg, var(--success), var(--warn)); }
    .progress-bar-fill.LOW { background: linear-gradient(90deg, #00d4aa, #00b894); }

    /* Stats row */
    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
    .stat-box {
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px; text-align: center;
    }
    .stat-box .stat-val { font-size: 20px; font-weight: 700; color: var(--accent2); }
    .stat-box .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 4px; }

    /* Churn drivers */
    .driver-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .driver-list li {
      display: flex; align-items: center; gap: 10px;
      background: var(--card2); border: 1px solid var(--border);
      padding: 10px 14px; border-radius: 10px; font-size: 13px;
    }
    .driver-list li::before { content: "⚡"; font-size: 14px; }

    /* Recommendations */
    .rec-list { display: flex; flex-direction: column; gap: 14px; }
    .rec-card {
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px;
    }
    .rec-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .rec-priority {
      font-size: 10px; font-weight: 700; padding: 3px 10px;
      border-radius: 20px; text-transform: uppercase;
    }
    .rec-priority.HIGH { background: rgba(255,77,109,0.2); color: var(--danger); }
    .rec-priority.MEDIUM { background: rgba(255,179,71,0.2); color: var(--warn); }
    .rec-priority.LOW { background: rgba(0,212,170,0.2); color: var(--success); }
    .rec-category { font-size: 11px; color: var(--muted); }
    .rec-action { font-size: 14px; font-weight: 600; color: var(--text); }
    .rec-desc { font-size: 13px; color: var(--muted); line-height: 1.5; margin-top: 6px; }
    .rec-impact {
      margin-top: 8px; font-size: 12px; color: var(--accent2);
      display: flex; align-items: center; gap: 6px;
    }
    .rec-impact::before { content: "📈"; }

    /* Retention message */
    .retention-msg {
      background: linear-gradient(135deg, rgba(108,99,255,0.1), rgba(0,212,170,0.1));
      border: 1px solid var(--accent);
      border-radius: 12px; padding: 16px; font-size: 14px; line-height: 1.6;
      margin-top: 20px;
    }

    /* Loading spinner */
    .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .section-gap { margin-top: 24px; }
    .full-width { grid-column: 1 / -1; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">📡 TeleChurn AI</div>
    <div class="subtitle">Churn Prediction & Retention Intelligence</div>
  </div>
  <div class="badge">🏆 Cognizant Hackathon 2025</div>
</header>

<div class="container">

  <!-- Input Form -->
  <div class="card">
    <div class="card-title">Customer Profile</div>
    <form id="churnForm">

      <div class="form-grid">
        <div class="form-group">
          <label>Gender</label>
          <select name="gender">
            <option value="0">Male</option>
            <option value="1">Female</option>
          </select>
        </div>
        <div class="form-group">
          <label>Contract Type</label>
          <select name="Contract">
            <option value="Month-to-month">Month-to-Month</option>
            <option value="One year">One Year</option>
            <option value="Two year">Two Year</option>
          </select>
        </div>
        <div class="form-group">
          <label>Internet Service</label>
          <select name="InternetService">
            <option value="DSL">DSL</option>
            <option value="Fiber optic">Fiber Optic</option>
            <option value="No">No Internet</option>
          </select>
        </div>
        <div class="form-group">
          <label>Payment Method</label>
          <select name="PaymentMethod">
            <option value="Electronic check">Electronic Check</option>
            <option value="Mailed check">Mailed Check</option>
            <option value="Bank transfer (automatic)">Bank Transfer (Auto)</option>
            <option value="Credit card (automatic)">Credit Card (Auto)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Multiple Lines</label>
          <select name="MultipleLines">
            <option value="No">No</option>
            <option value="Yes">Yes</option>
            <option value="No phone service">No Phone Service</option>
          </select>
        </div>
        <div class="form-group">
          <label>Online Security</label>
          <select name="OnlineSecurity">
            <option value="No">No</option>
            <option value="Yes">Yes</option>
            <option value="No internet service">No Internet Service</option>
          </select>
        </div>
        <div class="form-group">
          <label>Online Backup</label>
          <select name="OnlineBackup">
            <option value="No">No</option>
            <option value="Yes">Yes</option>
            <option value="No internet service">No Internet Service</option>
          </select>
        </div>
        <div class="form-group">
          <label>Device Protection</label>
          <select name="DeviceProtection">
            <option value="No">No</option>
            <option value="Yes">Yes</option>
            <option value="No internet service">No Internet Service</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tech Support</label>
          <select name="TechSupport">
            <option value="No">No</option>
            <option value="Yes">Yes</option>
            <option value="No internet service">No Internet Service</option>
          </select>
        </div>
        <div class="form-group">
          <label>Streaming TV</label>
          <select name="StreamingTV">
            <option value="No">No</option>
            <option value="Yes">Yes</option>
            <option value="No internet service">No Internet Service</option>
          </select>
        </div>
        <div class="form-group">
          <label>Streaming Movies</label>
          <select name="StreamingMovies">
            <option value="No">No</option>
            <option value="Yes">Yes</option>
            <option value="No internet service">No Internet Service</option>
          </select>
        </div>
        <div class="form-group">
          <label>Monthly Charges ($)</label>
          <input type="number" name="MonthlyCharges" min="0" max="200" step="0.01" value="65" required/>
        </div>
        <div class="form-group">
          <label>Tenure (Months)</label>
          <input type="number" name="tenure" min="0" max="120" value="12" required/>
        </div>
      </div>

      <div style="margin-top: 16px;">
        <div class="card-title" style="margin-bottom: 10px;">Additional Info</div>
        <div class="checkbox-grid">
          <label class="checkbox-item">
            <input type="checkbox" name="SeniorCitizen" value="1"/>
            <label>Senior Citizen</label>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="Partner" value="1"/>
            <label>Has Partner</label>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="Dependents" value="1"/>
            <label>Has Dependents</label>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="PhoneService" value="1" checked/>
            <label>Phone Service</label>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="PaperlessBilling" value="1"/>
            <label>Paperless Billing</label>
          </label>
        </div>
      </div>

      <button type="submit" class="btn-predict" id="predictBtn">
        🔍 Analyze Churn Risk & Get Recommendations
      </button>
    </form>
  </div>

  <!-- Results -->
  <div id="results" class="section-gap">
    <div class="grid-2">

      <!-- Left: Risk Score -->
      <div class="card">
        <div class="card-title">Churn Risk Score</div>
        <div class="risk-meter-wrap">
          <div class="risk-label">Churn Probability</div>
          <div class="risk-value" id="riskValue">--</div>
          <div><span class="risk-badge" id="riskBadge">--</span></div>
          <div class="progress-bar-wrap">
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
            </div>
          </div>
        </div>
        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-val" id="cltv">--</div>
            <div class="stat-lbl">Est. Customer LTV ($)</div>
          </div>
          <div class="stat-box">
            <div class="stat-val" id="riskLevel">--</div>
            <div class="stat-lbl">Risk Level</div>
          </div>
        </div>
      </div>

      <!-- Right: Churn Drivers -->
      <div class="card">
        <div class="card-title">⚡ Churn Risk Drivers</div>
        <ul class="driver-list" id="driverList"></ul>
        <div class="retention-msg" id="retentionMsg"></div>
      </div>

      <!-- Full width: Recommendations -->
      <div class="card full-width">
        <div class="card-title">🎯 AI Retention Recommendations</div>
        <div class="rec-list" id="recList"></div>
      </div>

    </div>
  </div>

</div>

<script>
  const form = document.getElementById('churnForm');
  const btn = document.getElementById('predictBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Analyzing...';

    const formData = new FormData(form);

    try {
      const res = await fetch('/predict', { method: 'POST', body: formData });
      const data = await res.json();

      if (data.error) { alert('Error: ' + data.error); return; }

      renderResults(data);
    } catch (err) {
      alert('Request failed: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '🔍 Analyze Churn Risk & Get Recommendations';
    }
  });

  function renderResults(data) {
    document.getElementById('results').style.display = 'block';
    document.getElementById('results').scrollIntoView({ behavior: 'smooth' });

    const prob = data.churn_probability;
    const risk = data.risk_level;

    // Risk score
    document.getElementById('riskValue').textContent = prob + '%';
    document.getElementById('riskValue').className = 'risk-value ' + risk;
    document.getElementById('riskBadge').textContent = risk + ' RISK';
    document.getElementById('riskBadge').className = 'risk-badge ' + risk;
    document.getElementById('progressBar').style.width = prob + '%';
    document.getElementById('progressBar').className = 'progress-bar-fill ' + risk;
    document.getElementById('cltv').textContent = '$' + data.estimated_cltv.toLocaleString();
    document.getElementById('riskLevel').textContent = risk;

    // Drivers
    const driverList = document.getElementById('driverList');
    driverList.innerHTML = data.churn_drivers.map(d => `<li>${d}</li>`).join('');

    // Retention message
    document.getElementById('retentionMsg').textContent = data.retention_message;

    // Recommendations
    const recList = document.getElementById('recList');
    recList.innerHTML = data.recommendations.map(r => `
      <div class="rec-card">
        <div class="rec-header">
          <span class="rec-priority ${r.priority}">${r.priority}</span>
          <span class="rec-category">${r.category}</span>
        </div>
        <div class="rec-action">${r.action}</div>
        <div class="rec-desc">${r.description}</div>
        <div class="rec-impact">${r.expected_impact}</div>
      </div>
    `).join('');
  }
</script>
</body>
</html>
