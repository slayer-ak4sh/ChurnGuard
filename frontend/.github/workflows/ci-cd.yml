name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Test Python services ────────────────────────────────────────────────────
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn pandas numpy scikit-learn xgboost lightgbm \
                      joblib motor pymongo httpx python-dotenv pydantic \
                      langchain langchain-groq langchain-core pytest pytest-asyncio

      - name: Train model
        run: cd churn_project && python train_model.py

      - name: Test ML service
        run: |
          cd churn_project
          python -c "
          from ml_service.main import app
          from fastapi.testclient import TestClient
          client = TestClient(app)
          r = client.get('/health')
          assert r.status_code == 200
          r = client.post('/predict', json={
              'tenure': 12, 'MonthlyCharges': 65.0,
              'Contract': 'Month-to-month', 'InternetService': 'DSL'
          })
          assert r.status_code == 200
          assert 'churn_probability' in r.json()
          print('✅ ML service tests passed')
          "

      - name: Test agent service
        run: |
          cd churn_project
          python -c "
          from agent_service.main import app
          from fastapi.testclient import TestClient
          client = TestClient(app)
          r = client.get('/health')
          assert r.status_code == 200
          r = client.post('/recommend', json={
              'tenure': 5, 'MonthlyCharges': 85.0, 'Contract': 'Month-to-month',
              'InternetService': 'Fiber optic', 'OnlineSecurity': False,
              'TechSupport': False, 'PaymentMethod': 'Electronic check',
              'Partner': False, 'Dependents': False,
              'churn_probability': 0.78, 'risk_level': 'HIGH'
          })
          assert r.status_code == 200
          assert 'recommendations' in r.json()
          print('✅ Agent service tests passed')
          "

  # ── Test React frontend ─────────────────────────────────────────────────────
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: churn_project/frontend/package-lock.json

      - name: Install & build
        run: |
          cd churn_project/frontend
          npm ci
          npm run build

  # ── Build & push Docker images ──────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [test-python, test-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Train model for Docker build
        run: |
          pip install pandas numpy scikit-learn xgboost lightgbm joblib
          cd churn_project && python train_model.py

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ML service
        uses: docker/build-push-action@v5
        with:
          context: ./churn_project
          file: ./churn_project/Dockerfile.ml
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/telecom-ml:latest

      - name: Build and push Agent service
        uses: docker/build-push-action@v5
        with:
          context: ./churn_project
          file: ./churn_project/Dockerfile.agent
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/telecom-agent:latest

      - name: Build and push Orchestrator
        uses: docker/build-push-action@v5
        with:
          context: ./churn_project
          file: ./churn_project/Dockerfile.orchestrator
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/telecom-orchestrator:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./churn_project
          file: ./churn_project/Dockerfile.frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/telecom-frontend:latest
